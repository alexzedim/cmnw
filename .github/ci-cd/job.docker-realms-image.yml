name: Create Realms Release Image

on:
  push:
    branches: [ development ]
    paths:
      - 'apps/realms/**'

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest #  buildjet-8vcpu-ubuntu-2204-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Tag new release
        uses: butlerlogic/action-autotag@1.1.4
        env:
          CR_PAT: ${{ secrets.CR_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/realms
          tags: |
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Realms
            org.opencontainers.image.vendor=alexzedim
            org.opencontainers.image.url=https://raw.githubusercontent.com/alexzedim/cmnw-next/master/public/static/cmnw.png
            org.opencontainers.image.source=https://github.com/alexzedim/cmnw

      - name: Login to Github Packages
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build & Push (GHCR)
        uses: docker/build-push-action@v7.3.0
        with:
          file: ./apps/realms/arm64.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/realms:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |

      - name: Image digest
        run: echo ${{ steps.build-push-action.outputs.digest }}
